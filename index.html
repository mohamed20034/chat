<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#10101a">
  <meta name="description" content="A lightweight real-time text and voice chat with encrypted private rooms.">
  <title>Open Chat — Text & Voice</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='26' fill='%237c5cff'/%3E%3Cpath d='M24 28h52v36H48L32 77V64h-8z' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="ambient ambient-one"></div><div class="ambient ambient-two"></div>
  <main class="app-shell" id="appShell" hidden>
    <aside class="sidebar">
      <div class="brand-row"><div class="brand-mark">O</div><div><div class="brand-name">open<span>chat</span></div><div class="brand-caption">TALK WITHOUT THE NOISE</div></div></div>
      <div class="sidebar-section-title">YOUR SPACES</div>
      <button class="space-item active" id="publicRoomBtn"><span class="space-icon">#</span><span class="space-copy"><b>Public lounge</b><small>Everyone is welcome</small></span><i class="live-dot"></i></button>
      <div class="sidebar-divider"></div>
      <div class="sidebar-section-title private-heading">PRIVATE SPACES <button id="createRoomBtn" class="icon-button small" title="Create private room" aria-label="Create private room">＋</button></div>
      <div class="private-empty" id="privateEmpty">Your invite-only rooms<br>will appear here.</div>
      <div class="sidebar-bottom">
        <div class="profile-card"><div class="avatar" id="myAvatar">G</div><div class="profile-copy"><b id="myName">Guest</b><small><i class="live-dot"></i> Online</small></div><button class="icon-button" id="editNameBtn" title="Change display name" aria-label="Change display name">✎</button></div>
        <button class="settings-link" id="settingsBtn"><span>⚙</span> Connection settings</button>
      </div>
    </aside>

    <section class="chat-panel">
      <header class="topbar">
        <div class="room-heading"><div class="room-hash" id="roomHash">#</div><div><h1 id="roomTitle">Public lounge</h1><p id="roomSubtitle">A place for open conversations</p></div></div>
        <div class="top-actions"><div class="online-pill"><i class="live-dot"></i><span id="onlineCount">1 online</span></div><button id="inviteBtn" class="outline-button" hidden>↗ <span>Invite</span></button></div>
      </header>

      <section class="voice-bar" id="voiceBar">
        <div class="voice-label"><span class="voice-wave">♫</span><div><b>Voice lounge</b><small id="voiceStatus">Join the room to talk live</small></div></div>
        <div class="voice-actions"><div class="voice-people" id="voicePeople"></div><button class="voice-button" id?
